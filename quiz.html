<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>

    <main>
        <h1 id="num">Question 1/50</h1>

        <div id="question"></div>

        <p id="resultat"></p> 
        <p id="score">Score : 0/0</p>

        <div id="controller">
            <button id="before">Question precedente</button> 
            <input type="text" id="reponse" placeholder="Votre réponse">
            <button id="verifier">Vérifier</button>
            <button id="next" class="next">Question suivante</button>
            <button id="voirRep" class="voirRep">Voir la reponse</button>
        </div>

        <script src="quiz.js"></script>
    </main>

</body>
</html>
